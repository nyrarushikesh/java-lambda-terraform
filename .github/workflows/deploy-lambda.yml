name: Deploy Java Lambda to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.6.6
  JAVA_VERSION: 17

jobs:
  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout GitHub repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 3️⃣ Build Java Lambda JAR
      - name: Build Java Lambda
        working-directory: app/hello-world
        run: mvn clean package

      # 4️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 5️⃣ Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # 6️⃣ Terraform Init
      - name: Terraform Init
        working-directory: infra/lambda
        run: terraform init

      # 7️⃣ Terraform Validate
      - name: Terraform Validate
        working-directory: infra/lambda
        run: terraform validate

      # 8️⃣ Terraform Plan
      - name: Terraform Plan
        working-directory: infra/lambda
        run: terraform plan

      # 9️⃣ Terraform Apply (Auto deploy)
      - name: Terraform Apply
        working-directory: infra/lambda
        run: terraform apply -auto-approve

      # 🔟 Get Function URL
      - name: Get Lambda Function URL
        working-directory: infra/lambda
        run: |
          echo "🚀 Lambda Function URL:"
          terraform output -raw function_url
          echo ""
          echo "✅ Access your Lambda at the URL above to see 'Hello World from Java Lambda!'"
