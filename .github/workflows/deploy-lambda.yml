name: Deploy Java Lambda to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.6.6
  JAVA_VERSION: 17

jobs:
  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout GitHub repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 3️⃣ Build Java Lambda JAR
      - name: Build Java Lambda
        working-directory: app/hello-world
        run: mvn clean package

      # 4️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 5️⃣ Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # 6️⃣ Terraform Init
      - name: Terraform Init
        working-directory: infra/lambda
        run: terraform init

      # 7️⃣ Terraform Validate
      - name: Terraform Validate
        working-directory: infra/lambda
        run: terraform validate

      # 8️⃣ Terraform Plan
      - name: Terraform Plan
        working-directory: infra/lambda
        run: terraform plan

      # 9️⃣ Terraform Apply (Auto deploy)
      - name: Terraform Apply
        working-directory: infra/lambda
        run: terraform apply -auto-approve

      # 🔟 Recreate Function URL with correct permissions
      - name: Fix Function URL Authorization
        run: |
          echo "Removing existing Function URL..."
          aws lambda delete-function-url-config --function-name hello-java 2>/dev/null || true
          
          echo "Removing old permissions..."
          aws lambda remove-permission --function-name hello-java --statement-id FunctionURLAllowPublicAccess 2>/dev/null || true
          aws lambda remove-permission --function-name hello-java --statement-id FunctionURLAllowInvoke 2>/dev/null || true
          aws lambda remove-permission --function-name hello-java --statement-id AllowPublicAccess 2>/dev/null || true
          
          echo "Creating Function URL..."
          aws lambda create-function-url-config \
            --function-name hello-java \
            --auth-type NONE \
            --cors '{"AllowOrigins":["*"],"AllowMethods":["*"],"AllowHeaders":["*"],"MaxAge":86400}'
          
          echo "Adding permissions (AWS requires BOTH after Oct 2025)..."
          aws lambda add-permission \
            --function-name hello-java \
            --statement-id FunctionURLAllowPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE
          
          aws lambda add-permission \
            --function-name hello-java \
            --statement-id FunctionURLAllowInvoke \
            --action lambda:InvokeFunction \
            --principal "*" \
            --function-url-auth-type NONE
          
          echo "✅ Function URL configured successfully with both required permissions!"

      # 1️⃣1️⃣ Get Function URL
      - name: Get Lambda Function URL
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config --function-name hello-java --query 'FunctionUrl' --output text)
          echo "🚀 Lambda Function URL:"
          echo "$FUNCTION_URL"
          echo ""
          echo "✅ Access your Lambda at the URL above to see 'Hello World from Java Lambda!'"
